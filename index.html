<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva — Quest Lan House</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10; --surface: #0d1117; --surface2: #131920;
    --border: #1e2d3d; --accent: #00d4ff; --accent3: #7fff00;
    --text: #c9d1d9; --text-dim: #8a9aab;
    --extreme: #a0a0a0; --eplus: #3b9eff; --epro: #ff3b3b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; min-height:100vh; overflow-x:hidden; }
  body::before {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
    background-size:40px 40px; pointer-events:none; z-index:0;
  }
  .container { max-width:520px; margin:0 auto; padding:40px 20px 60px; position:relative; z-index:1; }
  .banner { width:100%; border-radius:10px; overflow:hidden; margin-bottom:28px; border:1px solid var(--border); box-shadow:0 4px 24px rgba(0,0,0,0.5); }
  .banner img { width:100%; display:block; }
  .header { text-align:center; margin-bottom:40px; }
  .header-tag { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:4px; color:var(--accent); margin-bottom:12px; opacity:0.8; }
  .header h1 { font-family:'Orbitron',monospace; font-size:28px; font-weight:900; color:#fff; letter-spacing:2px; margin-bottom:8px; }
  .header h1 span { color:var(--accent); text-shadow:0 0 20px rgba(0,212,255,0.5); }
  @keyframes rainbow-cycle {
    0%   { color:#ff3b3b; text-shadow:0 0 16px #ff3b3b; }
    16%  { color:#ff9500; text-shadow:0 0 16px #ff9500; }
    33%  { color:#ffd700; text-shadow:0 0 16px #ffd700; }
    50%  { color:#3bff6b; text-shadow:0 0 16px #3bff6b; }
    66%  { color:#3b9eff; text-shadow:0 0 16px #3b9eff; }
    83%  { color:#c03bff; text-shadow:0 0 16px #c03bff; }
    100% { color:#ff3b3b; text-shadow:0 0 16px #ff3b3b; }
  }
  .rainbow-anim { animation:rainbow-cycle 3s linear infinite; }
  .grid-cat-sep { width:100%; display:flex; align-items:center; gap:8px; margin:10px 0 8px; font-family:'Orbitron',monospace; font-size:9px; letter-spacing:2px; }
  .grid-cat-sep.extreme { color:var(--extreme); }
  .grid-cat-sep.eplus   { color:var(--eplus); }
  .grid-cat-sep.epro    { color:var(--epro); }
  .grid-cat-sep::after  { content:''; flex:1; height:1px; background:currentColor; opacity:0.2; }
  .header p { font-size:14px; color:var(--text-dim); letter-spacing:1px; }
  .divider { width:60px; height:2px; background:linear-gradient(90deg,var(--accent),transparent); margin:16px auto; }

  .availability-bar { display:flex; gap:8px; margin-bottom:32px; justify-content:center; flex-wrap:wrap; }
  .avail-badge { display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:4px; border:1px solid; font-family:'Orbitron',monospace; font-size:10px; letter-spacing:1px; }
  .avail-badge.extreme { border-color:var(--extreme); background:rgba(160,160,160,0.08); }
  .avail-badge.eplus   { border-color:var(--eplus);   background:rgba(59,158,255,0.08); }
  .avail-badge.epro    { border-color:var(--epro);    background:rgba(255,59,59,0.08); }
  .avail-dot { width:8px; height:8px; border-radius:50%; animation:pulse 2s infinite; }
  .extreme .avail-dot { background:var(--extreme); box-shadow:0 0 6px var(--extreme); }
  .eplus   .avail-dot { background:var(--eplus);   box-shadow:0 0 6px var(--eplus); }
  .epro    .avail-dot { background:var(--epro);    box-shadow:0 0 6px var(--epro); }
  .avail-count { font-weight:700; font-size:14px; }
  .extreme .avail-count { color:var(--extreme); }
  .eplus   .avail-count { color:var(--eplus); }
  .epro    .avail-count { color:var(--epro); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:28px; margin-bottom:16px; position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--accent),transparent); }
  .step-label { font-family:'Orbitron',monospace; font-size:9px; letter-spacing:3px; color:var(--accent); margin-bottom:6px; opacity:0.7; }
  .field-label { font-size:13px; font-weight:600; letter-spacing:2px; color:#fff; text-transform:uppercase; margin-bottom:10px; }

  input[type="text"], input[type="password"] {
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:4px;
    padding:12px 16px; color:#fff; font-family:'Rajdhani',sans-serif; font-size:16px;
    letter-spacing:1px; outline:none; transition:border-color 0.2s,box-shadow 0.2s;
  }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,212,255,0.1); }
  input::placeholder { color:var(--text-dim); }

  .categories { display:flex; flex-direction:column; gap:10px; }
  .cat-option { position:relative; cursor:pointer; }
  .cat-option input[type="radio"] { position:absolute; opacity:0; pointer-events:none; }
  .cat-card { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border:1px solid var(--border); border-radius:6px; background:var(--surface2); transition:all 0.2s; cursor:pointer; }
  .cat-card:hover { border-color:#2a3f52; }
  .cat-option input:checked + .cat-card.extreme { border-color:var(--extreme); background:rgba(160,160,160,0.1); box-shadow:0 0 12px rgba(160,160,160,0.15); }
  .cat-option input:checked + .cat-card.eplus   { border-color:var(--eplus);   background:rgba(59,158,255,0.1);   box-shadow:0 0 12px rgba(59,158,255,0.15); }
  .cat-option input:checked + .cat-card.epro    { border-color:var(--epro);    background:rgba(255,59,59,0.1);    box-shadow:0 0 12px rgba(255,59,59,0.15); }
  .cat-left { display:flex; align-items:center; gap:12px; }
  .cat-icon { width:36px; height:36px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .cat-card.extreme .cat-icon { background:rgba(160,160,160,0.15); }
  .cat-card.eplus   .cat-icon { background:rgba(59,158,255,0.15); }
  .cat-card.epro    .cat-icon { background:rgba(255,59,59,0.12); }
  .cat-name { font-family:'Orbitron',monospace; font-size:13px; font-weight:700; letter-spacing:1px; }
  .cat-card.extreme .cat-name { color:var(--extreme); }
  .cat-card.eplus   .cat-name { color:var(--eplus); }
  .cat-card.epro    .cat-name { color:var(--epro); }
  .cat-sub { font-size:11px; color:var(--text-dim); margin-top:2px; letter-spacing:1px; }
  .cat-right { text-align:right; }
  .cat-price { font-family:'Orbitron',monospace; font-size:16px; font-weight:700; color:#fff; }
  .cat-slots { font-size:11px; color:var(--text-dim); margin-top:2px; letter-spacing:1px; }
  .cat-slots.soldout { color:#ff4444; }
  .cat-option.disabled .cat-card { opacity:0.4; cursor:not-allowed; filter:grayscale(0.5); }

  .pc-grid-label { font-size:12px; color:var(--text-dim); margin-bottom:12px; letter-spacing:1px; }
  .pc-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .pc-btn {
    width:52px; height:52px; border:1px solid var(--border); border-radius:6px;
    background:var(--surface2); color:var(--text); font-family:'Orbitron',monospace;
    font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:2px; padding:4px;
  }
  .pc-btn:hover:not(.taken) { border-color:var(--accent); color:var(--accent); }
  .pc-btn.selected.extreme { border-color:var(--extreme); background:rgba(160,160,160,0.2); color:var(--extreme); box-shadow:0 0 10px rgba(160,160,160,0.3); }
  .pc-btn.selected.eplus   { border-color:var(--eplus);   background:rgba(59,158,255,0.2);  color:var(--eplus);   box-shadow:0 0 10px rgba(59,158,255,0.3); }
  .pc-btn.selected.epro    { border-color:var(--epro);    background:rgba(255,59,59,0.2);   color:var(--epro);    box-shadow:0 0 10px rgba(255,59,59,0.3); }
  .pc-btn.taken { border-color:#1a2030; background:#0a0e14; color:#4a6070; cursor:not-allowed; }
  .pc-reserved-name { font-family:'Rajdhani',sans-serif; font-size:7px; color:#3a5060; max-width:48px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; text-align:center; line-height:1; }
  .legend { display:flex; gap:16px; margin-top:12px; flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); letter-spacing:1px; }
  .legend-box { width:14px; height:14px; border-radius:3px; border:1px solid; }

  .summary { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:20px; }
  .summary-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:14px; letter-spacing:1px; }
  .summary-row:not(:last-child) { border-bottom:1px solid var(--border); }
  .summary-row .label { color:var(--text-dim); }
  .summary-row .value { color:#fff; font-weight:600; }
  .summary-row.total .label { color:#fff; font-family:'Orbitron',monospace; font-size:12px; }
  .summary-row.total .value { font-family:'Orbitron',monospace; font-size:18px; color:var(--accent3); }

  .btn-pay { width:100%; padding:16px; background:linear-gradient(135deg,#00b4d8,#00d4ff); border:none; border-radius:6px; color:#000; font-family:'Orbitron',monospace; font-size:14px; font-weight:700; letter-spacing:2px; cursor:pointer; transition:all 0.2s; }
  .btn-pay:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(0,212,255,0.3); }


  .interest-section { margin-top:8px; margin-bottom:8px; }
  .btn-interest {
    width:100%; padding:13px 16px;
    background:rgba(127,255,0,0.06);
    border:1px dashed rgba(127,255,0,0.3);
    border-radius:6px; color:rgba(127,255,0,0.7);
    font-family:'Orbitron',monospace; font-size:10px;
    font-weight:700; letter-spacing:1px; cursor:pointer;
    transition:all 0.2s; text-align:center;
  }
  .btn-interest:hover { background:rgba(127,255,0,0.1); border-color:var(--accent3); color:var(--accent3); }
  .interest-form { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .interest-form input { flex:1; min-width:140px; }
  .interest-submit {
    padding:12px 16px; background:rgba(127,255,0,0.15);
    border:1px solid rgba(127,255,0,0.4); border-radius:4px;
    color:var(--accent3); font-family:'Orbitron',monospace;
    font-size:10px; font-weight:700; letter-spacing:1px; cursor:pointer;
    transition:all 0.2s; white-space:nowrap;
  }
  .interest-submit:hover { background:rgba(127,255,0,0.25); }

  .error-msg { color:#ff6b6b; font-size:12px; letter-spacing:1px; margin-top:6px; display:none; }
  .error-msg.visible { display:block; }

  /* ADMIN */
  .adm-trigger { text-align:center; margin-top:32px; margin-bottom:8px; }
  .adm-trigger-btn { background:rgba(255,107,53,0.08); border:1px solid #ff6b35; border-radius:4px; color:#ff6b35; font-family:'Orbitron',monospace; font-size:9px; letter-spacing:2px; padding:6px 14px; cursor:pointer; transition:all 0.2s; }
  .adm-trigger-btn:hover { background:rgba(255,107,53,0.2); }
  .adm-login { background:var(--surface); border:1px solid #ff6b35; border-radius:8px; padding:20px; margin-bottom:16px; display:none; }
  .adm-login.visible { display:block; }
  .adm-login-title { font-family:'Orbitron',monospace; font-size:11px; letter-spacing:3px; color:#ff6b35; margin-bottom:12px; }
  .adm-login-row { display:flex; gap:8px; }
  .adm-login-row input { flex:1; }
  .adm-login-row button { padding:12px 16px; background:#ff6b35; border:none; border-radius:4px; color:#000; font-family:'Orbitron',monospace; font-size:10px; font-weight:700; letter-spacing:1px; cursor:pointer; }
  .adm-panel { background:var(--surface); border:1px solid #ff6b35; border-radius:8px; padding:24px; margin-bottom:16px; display:none; }
  .adm-panel.visible { display:block; }
  .adm-panel-title { font-family:'Orbitron',monospace; font-size:11px; letter-spacing:3px; color:#ff6b35; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }
  .adm-close-btn { background:none; border:1px solid #ff6b35; border-radius:4px; color:#ff6b35; font-family:'Orbitron',monospace; font-size:9px; letter-spacing:1px; padding:4px 10px; cursor:pointer; }
  .adm-section-title { font-family:'Orbitron',monospace; font-size:9px; letter-spacing:2px; color:var(--text-dim); margin-bottom:10px; margin-top:16px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .adm-list { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .adm-item { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; }
  .adm-item-left { display:flex; align-items:center; gap:10px; }
  .adm-pc-badge { font-family:'Orbitron',monospace; font-size:11px; font-weight:700; width:40px; height:36px; border-radius:4px; display:flex; align-items:center; justify-content:center; }
  .adm-pc-badge.extreme { background:rgba(160,160,160,0.15); color:var(--extreme); border:1px solid var(--extreme); }
  .adm-pc-badge.eplus   { background:rgba(59,158,255,0.15);  color:var(--eplus);   border:1px solid var(--eplus); }
  .adm-pc-badge.epro    { background:rgba(255,59,59,0.12);   color:var(--epro);    border:1px solid var(--epro); }
  .adm-item-name { font-size:14px; font-weight:600; color:#fff; }
  .adm-item-cat  { font-size:10px; color:var(--text-dim); letter-spacing:1px; margin-top:1px; }

  .pc-btn.pending { border-color:#b8860b; background:rgba(184,134,11,0.12); color:#ffd700; cursor:not-allowed; }
  .pc-btn.pending .pc-reserved-name { color:#8a6800; }
  .adm-confirm-btn { background:none; border:1px solid rgba(127,255,0,0.4); border-radius:4px; color:var(--accent3); font-family:'Orbitron',monospace; font-size:9px; letter-spacing:1px; padding:5px 8px; cursor:pointer; transition:all 0.2s; }
  .adm-confirm-btn:hover { background:rgba(127,255,0,0.15); border-color:var(--accent3); }
  .adm-item.pending-item { border-color:rgba(255,215,0,0.3); background:rgba(255,215,0,0.04); }
  .pending-badge { font-family:'Orbitron',monospace; font-size:8px; letter-spacing:1px; color:#ffd700; padding:2px 6px; border:1px solid rgba(255,215,0,0.4); border-radius:3px; }

  .adm-remove-btn { background:none; border:1px solid #3a2020; border-radius:4px; color:#663333; font-family:'Orbitron',monospace; font-size:9px; letter-spacing:1px; padding:5px 10px; cursor:pointer; transition:all 0.2s; }
  .adm-remove-btn:hover { border-color:#ff4444; color:#ff4444; background:rgba(255,68,68,0.1); }
  .adm-add-form { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:16px; margin-top:8px; }
  .adm-add-row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .adm-add-row input, .adm-add-row select { flex:1; min-width:100px; background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:10px 12px; color:#fff; font-family:'Rajdhani',sans-serif; font-size:14px; outline:none; }
  .adm-add-row select option { background:var(--surface); }
  .adm-add-btn { width:100%; padding:12px; background:rgba(255,107,53,0.2); border:1px solid #ff6b35; border-radius:4px; color:#ff6b35; font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px; cursor:pointer; transition:all 0.2s; }
  .adm-add-btn:hover { background:rgba(255,107,53,0.35); }
  .adm-reset-btn { width:100%; margin-top:20px; padding:12px; background:rgba(255,30,30,0.1); border:1px solid #551111; border-radius:4px; color:#993333; font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px; cursor:pointer; transition:all 0.2s; }
  .adm-reset-btn:hover { border-color:#ff2222; color:#ff4444; background:rgba(255,30,30,0.2); }

  .adm-tabs { display:flex; gap:6px; margin-bottom:16px; }
  .adm-tab { flex:1; padding:8px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--text-dim); font-family:'Orbitron',monospace; font-size:9px; letter-spacing:2px; cursor:pointer; transition:all 0.2s; }
  .adm-tab.active { border-color:#ff6b35; color:#ff6b35; background:rgba(255,107,53,0.1); }
  .adm-edit-form { display:flex; flex-direction:column; gap:6px; }
  .adm-edit-label { font-family:'Orbitron',monospace; font-size:8px; letter-spacing:2px; color:var(--text-dim); margin-top:4px; }
  .adm-groups-editor { display:flex; flex-direction:column; gap:10px; }
  .adm-group-edit { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:12px; }
  .adm-group-edit-title { font-family:'Orbitron',monospace; font-size:9px; letter-spacing:2px; color:var(--accent); margin-bottom:8px; }
  .adm-group-edit-players { display:flex; flex-direction:column; gap:4px; }
  .adm-group-edit-players input { padding:8px 12px; font-size:13px; }

  .adm-empty { font-size:12px; color:var(--text-dim); letter-spacing:1px; padding:10px 0; text-align:center; }

  .location-card { display:flex; align-items:flex-start; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px; margin-top:24px; margin-bottom:8px; }
  .location-icon { font-size:22px; margin-top:2px; flex-shrink:0; }
  .location-name { font-family:'Orbitron',monospace; font-size:12px; font-weight:700; color:#fff; letter-spacing:1px; margin-bottom:4px; }
  .location-address { font-size:13px; color:var(--text-dim); letter-spacing:0.5px; margin-bottom:10px; }
  .location-link { display:inline-block; font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px; color:var(--accent); text-decoration:none; border:1px solid var(--accent); padding:6px 12px; border-radius:4px; transition:all 0.2s; }
  .location-link:hover { background:rgba(0,212,255,0.1); }
  .footer { text-align:center; margin-top:40px; font-size:11px; color:var(--text-dim); letter-spacing:2px; font-family:'Orbitron',monospace; opacity:0.4; }
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:#1a2a1a; border:1px solid var(--accent3); border-radius:6px; padding:12px 24px; color:var(--accent3); font-family:'Orbitron',monospace; font-size:11px; letter-spacing:2px; transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index:999; white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); }


  /* ── PC MAP ── */
  .pc-map-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px; margin-bottom:16px; position:relative; overflow:hidden; }
  .pc-map-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--accent),transparent); }
  .pc-map-label { font-family:'Orbitron',monospace; font-size:9px; letter-spacing:3px; color:var(--accent); margin-bottom:14px; opacity:0.7; }
  .pc-map-wrap { position:relative; display:inline-block; width:100%; }
  .pc-map-wrap img { width:100%; display:block; border-radius:6px; border:1px solid var(--border); }
  .pc-dot {
    position:absolute;
    width:14px; height:14px;
    border-radius:50%;
    transform:translate(-50%, -50%);
    pointer-events:none;
    transition:all 0.3s;
    opacity:0;
  }
  .pc-dot.active {
    opacity:1;
    animation:dotpulse 1s infinite;
  }
  .pc-dot.extreme { background:var(--extreme); box-shadow:0 0 8px 3px var(--extreme); }
  .pc-dot.eplus   { background:var(--eplus);   box-shadow:0 0 8px 3px var(--eplus); }
  .pc-dot.epro    { background:var(--epro);    box-shadow:0 0 8px 3px var(--epro); }
  @keyframes dotpulse {
    0%,100% { transform:translate(-50%,-50%) scale(1);   opacity:1; }
    50%      { transform:translate(-50%,-50%) scale(1.6); opacity:0.6; }
  }

  /* ── EVENT INFO ── */
  .info-section { margin-bottom: 32px; display: flex; flex-direction: column; gap: 12px; }
  .info-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px; position:relative; overflow:hidden; }
  .info-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--accent),transparent); }
  .info-card-title { font-family:'Orbitron',monospace; font-size:11px; font-weight:700; letter-spacing:3px; color:var(--accent); margin-bottom:14px; }
  .info-grid { display:flex; flex-direction:column; gap:10px; }
  .info-item { display:flex; align-items:flex-start; gap:10px; }
  .info-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
  .info-label { font-family:'Orbitron',monospace; font-size:8px; letter-spacing:2px; color:var(--text-dim); margin-bottom:2px; }
  .info-val { font-size:14px; color:#fff; font-weight:600; letter-spacing:0.5px; }
  .info-obs { font-size:12px; color:var(--text-dim); margin-top:14px; padding-top:12px; border-top:1px solid var(--border); line-height:1.6; letter-spacing:0.3px; }
  .player-grid { display:flex; flex-wrap:wrap; gap:6px; }
  .player-chip { font-size:12px; padding:5px 10px; border-radius:4px; letter-spacing:0.5px; font-weight:600; }
  .player-chip.confirmed { background:rgba(127,255,0,0.08); border:1px solid rgba(127,255,0,0.3); color:var(--accent3); }
  .player-chip.pending { background:rgba(0,212,255,0.06); border:1px solid rgba(0,212,255,0.2); color:var(--text-dim); }
  .groups-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .group-box { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:12px; }
  .group-title { font-family:'Orbitron',monospace; font-size:9px; letter-spacing:2px; color:var(--accent); margin-bottom:8px; }
  .group-player { font-size:12px; color:var(--text); padding:2px 0; letter-spacing:0.3px; }
  .group-player.empty { color:var(--text-dim); opacity:0.4; }
  .games-list { display:flex; flex-direction:column; gap:12px; }
  .games-format { border-bottom:1px solid var(--border); padding-bottom:12px; }
  .games-format:last-child { border-bottom:none; padding-bottom:0; }
  .games-format-title { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px; color:#fff; margin-bottom:8px; }
  .games-tags { display:flex; flex-wrap:wrap; gap:5px; }
  .gtag { font-size:11px; padding:3px 8px; background:var(--surface2); border:1px solid var(--border); border-radius:3px; color:var(--text); letter-spacing:0.3px; }
  .score-list { display:flex; flex-direction:column; gap:8px; }
  .score-item { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text); }
  .score-badge { font-family:'Orbitron',monospace; font-size:11px; font-weight:700; padding:4px 8px; border-radius:4px; min-width:36px; text-align:center; flex-shrink:0; }
  .score-badge.win { background:rgba(127,255,0,0.1); border:1px solid rgba(127,255,0,0.4); color:var(--accent3); }
  .score-badge.sweep { background:rgba(255,215,0,0.1); border:1px solid rgba(255,215,0,0.4); color:#ffd700; }
  .score-badge.tie { background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.3); color:var(--accent); }
  .rounds-list { display:flex; flex-direction:column; gap:8px; }
  .round-item { display:flex; align-items:flex-start; gap:10px; padding:8px; background:var(--surface2); border-radius:6px; border:1px solid var(--border); }
  .round-badge { font-family:'Orbitron',monospace; font-size:8px; font-weight:700; letter-spacing:1px; padding:4px 6px; border-radius:3px; text-align:center; flex-shrink:0; min-width:44px; }
  .round-badge.r5x5 { background:rgba(255,59,59,0.12); border:1px solid var(--epro); color:var(--epro); }
  .round-badge.r3x3 { background:rgba(59,158,255,0.1); border:1px solid var(--eplus); color:var(--eplus); }
  .round-badge.rind { background:rgba(127,255,0,0.08); border:1px solid rgba(127,255,0,0.4); color:var(--accent3); }
  .round-desc { font-size:12px; color:var(--text); line-height:1.6; letter-spacing:0.3px; }
  .round-desc b { color:#fff; }
  .finals-list { display:flex; flex-direction:column; gap:8px; }
  .final-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; }
  .final-fmt { font-family:'Orbitron',monospace; font-size:10px; font-weight:700; padding:4px 8px; border-radius:3px; background:rgba(0,212,255,0.08); border:1px solid var(--accent); color:var(--accent); min-width:40px; text-align:center; flex-shrink:0; }
  .final-fmt.mvp { background:rgba(255,215,0,0.1); border-color:#ffd700; color:#ffd700; }
  .final-game { font-size:12px; color:var(--text); letter-spacing:0.3px; }
  .final-mvp { border-color:rgba(255,215,0,0.3); background:rgba(255,215,0,0.04); }


  /* ── VER MAIS ── */
  .btn-ver-mais { width:100%; padding:11px; background:rgba(0,212,255,0.06); border:1px dashed rgba(0,212,255,0.3); border-radius:6px; color:var(--accent); font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px; cursor:pointer; transition:all 0.2s; margin-bottom:4px; }
  .btn-ver-mais:hover { background:rgba(0,212,255,0.12); }

  /* ── EXTRA BTNS ── */
  .extra-btns { display:flex; gap:8px; margin-top:8px; margin-bottom:8px; }
  .btn-extra { flex:1; padding:11px; background:rgba(0,212,255,0.06); border:1px solid rgba(0,212,255,0.2); border-radius:6px; color:var(--accent); font-family:'Orbitron',monospace; font-size:9px; letter-spacing:1px; cursor:pointer; transition:all 0.2s; }
  .btn-extra:hover { background:rgba(0,212,255,0.12); border-color:var(--accent); }

  /* ── MODAL ── */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; padding:16px; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:10px; width:100%; max-width:500px; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .modal-title { font-family:'Orbitron',monospace; font-size:12px; font-weight:700; letter-spacing:2px; color:#fff; }
  .modal-close { background:none; border:1px solid var(--border); border-radius:4px; color:var(--text-dim); font-size:14px; width:28px; height:28px; cursor:pointer; transition:all 0.2s; }
  .modal-close:hover { border-color:#ff4444; color:#ff4444; }
  .modal-body { overflow-y:auto; padding:16px 20px; flex:1; }

  /* ── FAQ ── */
  .faq-item { border-bottom:1px solid var(--border); }
  .faq-item:last-child { border-bottom:none; }
  .faq-q { width:100%; background:none; border:none; padding:14px 0; color:#fff; font-family:'Rajdhani',sans-serif; font-size:14px; font-weight:600; letter-spacing:1px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; text-align:left; }
  .faq-q:hover { color:var(--accent); }
  .faq-arrow { font-size:16px; transition:transform 0.2s; color:var(--accent); }
  .faq-q.open .faq-arrow { transform:rotate(180deg); }
  .faq-a { display:none; padding:0 0 14px 0; font-size:13px; color:var(--text); line-height:1.7; }
  .faq-a.open { display:block; }
  .faq-a ol, .faq-a ul { padding-left:18px; margin-top:6px; }
  .faq-a li { margin-bottom:4px; }
  .faq-format-row { display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; font-size:12px; }
  .faq-fmt-badge { font-family:'Orbitron',monospace; font-size:8px; font-weight:700; padding:3px 7px; border-radius:3px; background:rgba(0,212,255,0.1); border:1px solid var(--accent); color:var(--accent); flex-shrink:0; margin-top:1px; }
  .faq-score-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; }
  .faq-round { display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; font-size:12px; color:var(--text); }
  .faq-final-row { font-size:13px; margin-bottom:8px; color:var(--text); }

  /* ── GAMES TAGS with links ── */
  a.gtag { text-decoration:none; display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:3px 8px; background:var(--surface2); border:1px solid var(--border); border-radius:3px; color:var(--text); letter-spacing:0.3px; transition:all 0.2s; }
  a.gtag:hover { border-color:var(--accent); color:var(--accent); }
  .gtag-free { font-family:'Orbitron',monospace; font-size:7px; letter-spacing:1px; color:var(--accent3); border:1px solid rgba(127,255,0,0.4); border-radius:2px; padding:1px 3px; }

  /* ── RESERVA MODAL ── */
  .reserva-card { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:18px; text-align:center; }
  .reserva-pc-num { font-family:'Orbitron',monospace; font-size:36px; font-weight:900; margin-bottom:4px; }
  .reserva-pc-num.extreme { color:var(--extreme); }
  .reserva-pc-num.eplus   { color:var(--eplus); }
  .reserva-pc-num.epro    { color:var(--epro); }
  .reserva-cat  { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px; margin-bottom:14px; }
  .reserva-name { font-size:18px; font-weight:700; color:#fff; margin-bottom:6px; }
  .reserva-status { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:2px; padding:6px 12px; border-radius:4px; display:inline-block; margin-top:8px; }
  .reserva-status.confirmed { background:rgba(127,255,0,0.1); border:1px solid rgba(127,255,0,0.4); color:var(--accent3); }
  .reserva-status.pending   { background:rgba(255,215,0,0.1); border:1px solid rgba(255,215,0,0.4); color:#ffd700; }
  .reserva-map-wrap { position:relative; display:inline-block; width:140px; margin-top:14px; }
  .reserva-map-wrap img { width:100%; display:block; border-radius:6px; border:1px solid var(--border); }
  .reserva-not-found { text-align:center; padding:20px; color:var(--text-dim); font-size:13px; letter-spacing:0.5px; }

  /* ── PARTICLES CANVAS ── */
  #particles-canvas { position:fixed; inset:0; pointer-events:none; z-index:2; }

  /* ── ADM TIMES ── */
  .times-player-toggle { font-size:12px; padding:5px 10px; border-radius:4px; border:1px solid var(--border); background:rgba(127,255,0,0.08); color:var(--accent3); cursor:pointer; transition:all 0.2s; letter-spacing:0.5px; }
  .times-player-toggle.off { background:var(--surface2); color:var(--text-dim); border-color:var(--border); text-decoration:line-through; }
  .times-result-group { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:8px; }
  .times-result-title { font-family:'Orbitron',monospace; font-size:9px; letter-spacing:2px; color:var(--accent); margin-bottom:8px; }
  .times-result-player { font-size:13px; color:var(--text); padding:2px 0; }

</style>
</head>
